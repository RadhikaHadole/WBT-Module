<script>
  let record = new Promise(function (res, rej) {
    console.log(typeof res, typeof rej);
    setTimeout(function () {
      res({msg:"API Called"})
      rej({ msg: "API Failed" });
    }, 3000);
  });
  console.log(record);
  record
    .then(function (result) {
      console.log(result);
    })
    .catch(function (errormsg) {
      console.log(errormsg);
    })
    .finally(function () {
      console.log("Next Task");
    });
</script>
